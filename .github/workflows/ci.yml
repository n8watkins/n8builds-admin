name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes can be cancelled; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only changes (Markdown, docs/, the license) skip the build and the
  # browser tests: nothing they test can change. Workflow changes run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Without a usable base (a new branch, a force push), run everything.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD_SHA")
          echo "$files"
          code_files=$(echo "$files" | grep -vE '^(docs/.*|.*\.md|LICENSE)$' || true)
          if [ -n "$code_files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs-only change: build and browser tests skipped."
          fi
      # The browser tests run in Playwright's image, which must match the
      # installed Playwright exactly; an upgrade moves CI to its image by itself.
      - id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  # One job, not two: the private repo's Actions minutes are limited, and the
  # browser tests need both production builds anyway (playwright.config.ts).
  # No secrets: the gate tests the normal build signed out, and the app tests
  # use the E2E build's test-only sign-in; GitHub pages show "not connected".
  test:
    name: Lint, types, unit, build, E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      options: --ipc=host
    env:
      # Browsers refuse a HOME owned by another user (the container runs as root).
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      # cloudflare-env.d.ts must match wrangler.jsonc's bindings.
      - run: npm run check:cf-types
      # The normal build (.next, which the gate specs start) and the Worker
      # bundle made from it, checked for both sign-in bypasses, then a dry-run
      # deploy, so a change that breaks the Cloudflare build fails here.
      - run: npm run build:worker
      - run: npm run check:deploy
      - run: npm run build:e2e
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  # The one check to require if branch protection ever becomes available here:
  # passes when every job passed or was skipped on purpose (a docs-only change).
  result:
    name: CI result
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a CI job ended as $result"; exit 1 ;;
            esac
          done
